<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
<title id="title">High correlation is not verification</title>
<desc id="desc">Synthetic independent CAN holdout. The accepted speed decoder has zero error. A plausible wrong bit field has correlation 0.9836 but RMSE 29.84 kilometres per hour and remains unconfirmed.</desc>
<rect width="1500" height="850" fill="#f7f8f5"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif} .title{font-size:34px;font-weight:700;fill:#172a3a} .sub{font-size:18px;fill:#5a6872} .label{font-size:16px;fill:#52636e} .legend{font-size:18px;fill:#263742}</style>
<text x="60" y="58" class="title">High correlation is not verification</text>
<text x="60" y="94" class="sub">Synthetic independent CAN holdout • error against the time-aligned speed reference</text>
<rect x="999" y="38" width="436" height="96" rx="8" fill="#e3f1ed" stroke="#b4d6cd"/>
<text x="1018" y="70" style="font-size:18px;font-weight:700;fill:#11675f">PASS • r = 1.0000 • RMSE = 0.00 km/h</text>
<text x="1018" y="105" class="label">30/30 values agree exactly in this fixture</text>
<rect x="999" y="142" width="436" height="96" rx="8" fill="#fbefdd" stroke="#e8cda5"/>
<text x="1018" y="174" style="font-size:18px;font-weight:700;fill:#9a5b13">UNCONFIRMED • r = 0.9836 • RMSE = 29.84</text>
<text x="1018" y="209" class="label">Correlation alone would look deceptively strong</text>

