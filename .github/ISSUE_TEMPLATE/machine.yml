name: Bring a machine or existing project
description: Suggest a machine, repair system, sensor setup or related project.
title: "[Machine or project]: "
body:
  - type: markdown
    attributes:
      value: "Tell us about a machine or project you care about. Ideas, questions and links are welcome; you do not need to write code."
  - type: textarea
    id: machine
    attributes:
      label: Machine or project
      description: "What is it, and what do you want to keep working?"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What do we know?
      description: "Describe first-hand experience, observations, links, licences where known, and what is unverified."
  - type: textarea
    id: help
    attributes:
      label: Useful next experiment or help needed
      description: "What small step could move this forward?"
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: "I have removed private details and have permission to share any attached material."
          required: true
